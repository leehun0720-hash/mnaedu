<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>Frontier M&amp;A</title>
  <desc>Simplified symbol form for sizes at or below 24px, per BI/CI guideline section 04.</desc>
  <rect width="32" height="32" fill="#08264D"/>
  <!-- left structure, stepping up (UPWARD RHYTHM) -->
  <path d="M5 27v-8h3v8z" fill="#F8F7F3" opacity="0.5"/>
  <path d="M10 27V12h4v15z" fill="#F8F7F3"/>
  <!-- centre tower carrying the negative-space F -->
  <path d="M15 27V6h2v21z" fill="#F8F7F3"/>
  <!-- right structure in Heritage Gold (MERGER: two masses meeting at centre) -->
  <path d="M18 6h4v21h-4z" fill="#C49A3A"/>
  <path d="M23 27V14h3v13z" fill="#C49A3A" opacity="0.7"/>
  <!-- negative-space F -->
  <rect x="18" y="10" width="3.4" height="1.7" fill="#08264D"/>
  <rect x="18" y="14.4" width="2.4" height="1.7" fill="#08264D"/>
  <!-- baseline -->
  <rect x="4" y="27" width="24" height="1.7" fill="#C49A3A"/>
</svg>
